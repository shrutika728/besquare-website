<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Embedded Design Process</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 40px 20px;
      text-align: center;
    }

    .process-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 40px;
      max-width: 1200px;
      margin: auto;
    }

    .step {
      position: relative;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background-color: #fff;
      box-shadow: 0 0 0 6px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: pulse 2.5s infinite ease-in-out;
    }

    .step:hover {
      transform: scale(1.07);
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      animation-play-state: paused;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.1); }
      50% { box-shadow: 0 0 0 12px rgba(0, 0, 0, 0.05); }
      100% { box-shadow: 0 0 0 0 rgba(0, 0, 0, 0.1); }
    }

    .step .icon {
      font-size: 40px;
      color: #fff;
      z-index: 2;
    }

    .step-label-top,
    .step-label-bottom {
      width: 180px;
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    /* Step specific colors */
    .step1 { background: #00897b; }
    .step2 { background: #c62828; }
    .step3 { background: #6d4c41; }
    .step4 { background: #827717; }
    .step5 { background: #6a1b9a; }

    .label1 { color: #00897b; }
    .label2 { color: #c62828; }
    .label3 { color: #6d4c41; }
    .label4 { color: #827717; }
    .label5 { color: #6a1b9a; }

    @media (max-width: 768px) {
      .process-container {
        flex-direction: column;
      }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div class="process-container">
    <div>
      <div class="step step1">
        <div class="icon"><i class="fas fa-lightbulb"></i></div>
      </div>
      <div class="step-label-top label1">Project Requirements</div>
    </div>

    <div>
      <div class="step step2">
        <div class="icon"><i class="fas fa-clipboard-list"></i></div>
      </div>
      <div class="step-label-bottom label2">Tech Specs & Design</div>
    </div>

    <div>
      <div class="step step3">
        <div class="icon"><i class="fas fa-microchip"></i></div>
      </div>
      <div class="step-label-top label3">Embedded Software</div>
    </div>

    <div>
      <div class="step step4">
        <div class="icon"><i class="fas fa-certificate"></i></div>
      </div>
      <div class="step-label-bottom label4">Testing & Cert.</div>
    </div>

    <div>
      <div class="step step5">
        <div class="icon"><i class="fas fa-industry"></i></div>
      </div>
      <div class="step-label-top label5">Mass Production</div>
    </div>
  </div>

</body>
</html>
